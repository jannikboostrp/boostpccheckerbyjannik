name: BoostChecker CI / Integrity Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Scripts & Core Package
        shell: powershell
        run: |
          Write-Host "Verifying Run.ps1 and Launch.ps1 syntax..."
          $err1 = $null; [System.Management.Automation.Language.Parser]::ParseFile("./Run.ps1", [ref]$null, [ref]$err1)
          if ($err1.Count -gt 0) { throw "Run.ps1 has parse errors: $err1" }

          $err2 = $null; [System.Management.Automation.Language.Parser]::ParseFile("./Launch.ps1", [ref]$null, [ref]$err2)
          if ($err2.Count -gt 0) { throw "Launch.ps1 has parse errors: $err2" }

          Write-Host "Verifying encrypted Core package is present and non-trivial..."
          if (-not (Test-Path "./Core/BoostCore.pkg")) {
            throw "Core/BoostCore.pkg is missing!"
          }
          $size = (Get-Item "./Core/BoostCore.pkg").Length
          if ($size -lt 50000) {
            throw "Core/BoostCore.pkg suspiciously small ($size bytes)!"
          }
          Write-Host "[OK] BoostCore.pkg present ($size bytes)."
